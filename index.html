<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Chat</title>
  </head>
  <body>
    <video id="placeholder2" autoplay muted playsinline loop hidden>
      <source src="assets/technical-difficulties-tenna.webm" type="video/webm">
    </video>
    <img id="placeholder" hidden>
    <h2>Start your Camera and Microphone</h2>
    <div class="videos">
      <span>
        <h3>Your Stream</h3>
        <video id="localVideo" autoplay playsinline></video>
        <div>
          <img id="iconCam" height="50">
          <img id="iconMic" height="50">
          <img id="iconShr" height="50">
        </div>
      </span>
      <span>
        <h3>Remote Stream</h3>
        <video id="remoteVideo" autoplay playsinline></video>
        <div>
          <img id="iconCam" height="50">
          <img id="iconMic" height="50">
          <img id="iconShr" height="50">
        </div>
      </span>
    </div>

    <div class="buttons">
      <button id="camButton">
      <button id="micButton">
      <button id="shrButton">
    </div>
    <h2>Create a Call</h2>
    <button id="callButton">Create</button>
    <p id="idDisplay"></p>
    <p id="callStatus"></p>

    <h2>Join the Call</h2>
    <p>Join the call from a different browser window or device</p>
    
    <input id="callInput" />
    <button id="joinButton" disabled>Join</button>
    <p id="answerStatus"></p>

    <h2>End the Call</h2>

    <button id="endButton" disabled>End</button>

    <script type="module" src="/main.js"></script>
  </body>
</html>
